# Striker 26 — static site, nothing to build.
[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# ---- pretty URLs ----
# /multiplayer  ->  multiplayer.html   (the "join with a code" page)
[[redirects]]
  from = "/multiplayer"
  to = "/multiplayer.html"
  status = 200

# handy aliases
[[redirects]]
  from = "/join"
  to = "/multiplayer.html"
  status = 200

[[redirects]]
  from = "/play"
  to = "/index.html"
  status = 200

# ---- caching: never cache the HTML shell or the service worker ----
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/multiplayer.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
